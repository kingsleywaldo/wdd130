<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Contact White Water Rafting Company for trips, reservations, and support.">
    <meta name="author" content="Your Name">

    <title>Contact Us | White Water Rafting Company</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main>

        <h1>White Water Rafting Company</h1>

        <!-- COMPANY INFO -->
        <section class="contact-info">

            <h2>Contact Information</h2>

            <p><strong>Address:</strong> 123 Main River Street, Kolob, California</p>
            <p><strong>Phone:</strong> +1 999 999 9999</p>
            <p><strong>Email:</strong> info@whitewater.com</p>

            <!-- Google Map -->
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.835434509374!2d-122.4194!3d37.7749!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1"
              loading="lazy" allowfullscreen>
            </iframe>

        </section>

        <!-- CONTACT FORM -->
        <section class="contact-form">

            <h2>Send Us a Message</h2>

            <form action="#" method="post">

                <label for="name">Name:</label>
                <input type="text" id="name" name="name">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <p>Message Purpose:</p>

                <label>
                    <input type="radio" name="purpose" value="general" checked>
                    General Inquiry
                </label>

                <label>
                    <input type="radio" name="purpose" value="reservation">
                    Reservation Question
                </label>

                <label>
                    <input type="radio" name="purpose" value="suggestion">
                    Website Suggestion
                </label>

                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>

                <label>
                    <input type="checkbox" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>

        </section>

        <!-- EMPLOYEES -->
        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Employee Profile">
                <figcaption>Employee Name</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Employee Profile">
                <figcaption>Employee Name</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Employee Profile">
                <figcaption>Employee Name</figcaption>
            </figure>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 White Water Rafting Company | Kingsley Waldo
        </p>

        <nav class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
            <a href="#"><img src="images/linkedin.png" alt="linkedin"></a>
        </nav>

    </footer>

</body>

</html>
