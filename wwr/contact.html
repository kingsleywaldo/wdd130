<main>

    <h1>Contact Us</h1>

    <!-- Company Information -->
    <section class="contact-info">

        <h2>Company Information</h2>

        <p><strong>Address:</strong> 123 River Rapids Road, Adventure Valley, ID 83440</p>

        <p><strong>Phone:</strong> (208) 555-1234</p>

        <p><strong>Email:</strong> info@excitingexpeditions.com</p>

        <iframe src="https://www.google.com/maps/embed?pb=YOUR_MAP_CODE_HERE" loading="lazy"
          allowfullscreen>
        </iframe>

    </section>

    <!-- Employee Profiles -->
    <section class="employees">

        <h2>Meet Our Team</h2>

        <figure>
            <img src="images/employee1.jpg" alt="Sarah Johnson">
            <figcaption>Sarah Johnson - General Manager</figcaption>
        </figure>

        <figure>
            <img src="images/employee2.jpg" alt="Michael Brown">
            <figcaption>Michael Brown - Lead River Guide</figcaption>
        </figure>

        <figure>
            <img src="images/employee3.jpg" alt="Emily Davis">
            <figcaption>Emily Davis - Customer Service Representative</figcaption>
        </figure>

    </section>

    <!-- Contact Form -->
    <section class="contact-form">

        <h2>Send Us a Message</h2>

        <form action="#" method="post">

            <label for="fullname">Name:</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <fieldset>

                <legend>Purpose of Message</legend>

                <label>
                    <input type="radio" name="purpose" value="general" checked>
                    General Inquiry
                </label>

                <label>
                    <input type="radio" name="purpose" value="reservation">
                    Reservation Question
                </label>

                <label>
                    <input type="radio" name="purpose" value="suggestion">
                    Website Suggestion
                </label>

            </fieldset>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <label class="checkbox">
                <input type="checkbox" name="newsletter">
                Please subscribe me to the monthly newsletter
            </label>

            <button type="submit">Send Message</button>

        </form>

    </section>

</main>
